<text x="596.8" y="96.0" font-size="11" fill="#59636e" font-weight="400" text-anchor="end">did not pass</text>
<path d="M778.0 72.0V186.0H62.0V78.0" stroke="#818b98" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
<path d="M62.0 71.0l-4 7h8z" fill="#818b98"/>
<text x="250" y="190.0" font-size="12" fill="#59636e" font-weight="500" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">the scorecard learns: the next task of the type starts with route and warnings</text>
</svg>
