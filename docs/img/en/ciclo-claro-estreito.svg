<text x="182.0" y="206.0" font-size="11" fill="#59636e" font-weight="400" text-anchor="end">did not pass</text>
<path d="M356.0 182.0V296.0H10V39.0H18.0" stroke="#818b98" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
<path d="M25.0 39.0l-7 -4v8z" fill="#818b98"/>
<text x="170" y="300.0" font-size="12" fill="#59636e" font-weight="500" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">the scorecard learns the route</text>
</svg>
