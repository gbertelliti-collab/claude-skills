<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 296" width="420" height="296" role="img" aria-label="276 tarefas delegadas, 84% aprovadas de primeira, 4 voltaram para o chefe, 4,9% do custo nos agentes Haiku e Sonnet" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>276 tarefas delegadas, 84% aprovadas de primeira, 4 voltaram para o chefe, 4,9% do custo nos agentes Haiku e Sonnet</title>
<rect width="420" height="296" rx="12" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="201" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="18" y="52" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">276</text>
<text x="18" y="80" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">tarefas delegadas</text>
<text x="18" y="102" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">em 6 dias, 9 sessões</text>
<text x="18" y="119" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">e 12 projetos diferentes</text>
<rect x="218.5" y="0.5" width="201" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="236" y="52" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">84%</text>
<text x="236" y="80" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">aprovadas de primeira</text>
<text x="236" y="102" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">231 de 276 passaram na</text>
<text x="236" y="119" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">1ª conferência do chefe</text>
<rect x="0.5" y="156.5" width="201" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="18" y="208" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">4</text>
<text x="18" y="236" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">voltaram para o chefe</text>
<text x="18" y="258" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">outras 41 fecharam em</text>
<text x="18" y="275" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">até 3 rodadas de correção</text>
<rect x="218.5" y="156.5" width="201" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="236" y="208" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">4,9%</text>
<text x="236" y="236" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">do custo em tokens</text>
<text x="236" y="258" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">é o que gastaram os 255</text>
<text x="236" y="275" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">agentes Haiku e Sonnet</text>
</svg>
