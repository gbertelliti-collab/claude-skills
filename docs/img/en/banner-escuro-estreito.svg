<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" aria-label="orquestrador: Claude Code plugin with a lead, Haiku and Sonnet workers and a scorecard that learns" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>orquestrador: Claude Code plugin with a lead, Haiku and Sonnet workers and a scorecard that learns</title>
