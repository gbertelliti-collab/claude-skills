<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="840" height="140" role="img" aria-label="144 tasks delegated, 82% passed first try, 2 went back to the lead, 3.2% of the cost on Haiku and Sonnet agents" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>144 tasks delegated, 82% passed first try, 2 went back to the lead, 3.2% of the cost on Haiku and Sonnet agents</title>
<rect x="0.5" y="0.5" width="196" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="18" y="52" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">144</text>
<text x="18" y="80" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">tasks delegated</text>
<text x="18" y="102" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">in 3 days, 5 sessions</text>
<text x="18" y="119" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">and 9 different projects</text>
<rect x="214.5" y="0.5" width="196" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="232" y="52" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">82%</text>
<text x="232" y="80" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">passed first try</text>
<text x="232" y="102" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">118 of 144 passed the</text>
<text x="232" y="119" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">lead's first check</text>
<rect x="428.5" y="0.5" width="196" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="446" y="52" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">2</text>
<text x="446" y="80" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">went back to the lead</text>
<text x="446" y="102" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">another 24 closed within</text>
<text x="446" y="119" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">2 correction rounds</text>
<rect x="642.5" y="0.5" width="196" height="139" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="660" y="52" font-size="36" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="-0.5">3.2%</text>
<text x="660" y="80" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">of the token cost</text>
<text x="660" y="102" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">is what the 134 Haiku</text>
<text x="660" y="119" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">and Sonnet agents spent</text>
</svg>
