<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="Lead's cycle: scorecard, split, brief, dispatch, check (if it did not pass, correct in up to 3 rounds) and log; the log feeds the scorecard, which learns" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>Lead's cycle: scorecard, split, brief, dispatch, check (if it did not pass, correct in up to 3 rounds) and log; the log feeds the scorecard, which learns</title>
<rect x="0.0" y="8.0" width="124.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="62.0" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Scorecard</text>
<text x="62.0" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">route per type</text>
<rect x="143.2" y="8.0" width="124.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="205.2" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Split</text>
<text x="205.2" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">type, owner, check</text>
<path d="M126.0 39.0H136.2" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M142.2 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="286.4" y="8.0" width="124.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="348.4" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Brief</text>
<text x="348.4" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">fully drawn</text>
<path d="M269.2 39.0H279.4" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M285.4 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="429.6" y="8.0" width="124.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="491.59999999999997" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Dispatch</text>
<text x="491.59999999999997" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">in parallel</text>
<path d="M412.4 39.0H422.6" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M428.6 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="572.8" y="8.0" width="124.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#2a78d6" stroke-width="2"/>
<text x="634.8" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Check</text>
<text x="634.8" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">lead runs the check</text>
<path d="M555.6 39.0H565.8" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M571.8 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="716.0" y="8.0" width="124.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="778.0" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Log</text>
<text x="778.0" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">1 line per task</text>
<path d="M698.8 39.0H709.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M715.0 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="572.8" y="112.0" width="124.0" height="46.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="634.8" y="133.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Correct</text>
<text x="634.8" y="151.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">up to 3 rounds</text>
<path d="M604.8 72.0V104.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M604.8 111.0l-4 -7h8z" fill="#818b98"/>
