name: Problema
description: Algo não funcionou como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: o-que-esperava
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri o Claude Code com o plugin
        2. Pedi uma obra com duas partes
        3. Vi o erro
    validations:
      required: true
  - type: input
    id: versao-claude-code
    attributes:
      label: Versão do Claude Code (`claude --version`)
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: saida-motor
    attributes:
      label: Saída de `operarios.py status` e `operarios.py conferir`
      render: text
    validations:
      required: false
  - type: checkboxes
    id: sem-dado-pessoal
    attributes:
      label: Antes de enviar
      options:
        - label: Conferi que não colei chave, caminho pessoal nem dado de cliente
          required: true
