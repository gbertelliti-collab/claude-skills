<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="840" height="140" role="img" aria-label="276 tasks delegated, 84% passed first try, 4 went back to the lead, 4.9% of the cost on Haiku and Sonnet agents" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>276 tasks delegated, 84% passed first try, 4 went back to the lead, 4.9% of the cost on Haiku and Sonnet agents</title>
<rect x="0.5" y="0.5" width="196" height="139" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="18" y="52" font-size="36" fill="#f0f6fc" font-weight="700" text-anchor="start" letter-spacing="-0.5">276</text>
<text x="18" y="80" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start">tasks delegated</text>
<text x="18" y="102" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">in 6 days, 9 sessions</text>
<text x="18" y="119" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">and 12 different projects</text>
<rect x="214.5" y="0.5" width="196" height="139" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="232" y="52" font-size="36" fill="#f0f6fc" font-weight="700" text-anchor="start" letter-spacing="-0.5">84%</text>
<text x="232" y="80" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start">passed first try</text>
<text x="232" y="102" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">231 of 276 passed the</text>
<text x="232" y="119" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">lead's first check</text>
<rect x="428.5" y="0.5" width="196" height="139" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="446" y="52" font-size="36" fill="#f0f6fc" font-weight="700" text-anchor="start" letter-spacing="-0.5">4</text>
<text x="446" y="80" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start">went back to the lead</text>
<text x="446" y="102" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">another 41 closed within</text>
<text x="446" y="119" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">3 correction rounds</text>
<rect x="642.5" y="0.5" width="196" height="139" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="660" y="52" font-size="36" fill="#f0f6fc" font-weight="700" text-anchor="start" letter-spacing="-0.5">4.9%</text>
<text x="660" y="80" font-size="13.5" fill="#f0f6fc" font-weight="600" text-anchor="start">of the token cost</text>
<text x="660" y="102" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">is what the 255 Haiku</text>
<text x="660" y="119" font-size="12" fill="#9198a1" font-weight="400" text-anchor="start">and Sonnet agents spent</text>
</svg>
