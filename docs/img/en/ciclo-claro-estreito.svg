<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310" role="img" aria-label="Lead's cycle: scorecard, split, brief, dispatch, check (if it did not pass, correct in up to 3 rounds) and log; the log feeds the scorecard, which learns" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>Lead's cycle: scorecard, split, brief, dispatch, check (if it did not pass, correct in up to 3 rounds) and log; the log feeds the scorecard, which learns</title>
<rect width="420" height="310" rx="12" fill="#ffffff"/>
<rect x="26.0" y="8.0" width="116.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="84.0" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Scorecard</text>
<text x="84.0" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">route per type</text>
<rect x="162.0" y="8.0" width="116.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="220.0" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Split</text>
<text x="220.0" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">type, owner, check</text>
<path d="M144.0 39.0H155.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M161.0 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="298.0" y="8.0" width="116.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="356.0" y="37.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Brief</text>
<text x="356.0" y="55.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">fully drawn</text>
<path d="M280.0 39.0H291.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M297.0 39.0l-7 -4v8z" fill="#818b98"/>
<rect x="26.0" y="118.0" width="116.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="84.0" y="147.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Dispatch</text>
<text x="84.0" y="165.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">in parallel</text>
<rect x="162.0" y="118.0" width="116.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#2a78d6" stroke-width="2"/>
<text x="220.0" y="147.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Check</text>
<text x="220.0" y="165.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">lead runs the check</text>
<path d="M144.0 149.0H155.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M161.0 149.0l-7 -4v8z" fill="#818b98"/>
<rect x="298.0" y="118.0" width="116.0" height="62.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="356.0" y="147.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Log</text>
<text x="356.0" y="165.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">1 line per task</text>
<path d="M280.0 149.0H291.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M297.0 149.0l-7 -4v8z" fill="#818b98"/>
<path d="M356.0 72V94H84.0V110" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M84.0 117.0l-4 -7h8z" fill="#818b98"/>
<rect x="162.0" y="222.0" width="116.0" height="46.0" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="220.0" y="243.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Correct</text>
<text x="220.0" y="261.0" font-size="11.5" fill="#59636e" font-weight="400" text-anchor="middle">up to 3 rounds</text>
<path d="M190.0 182.0V214.0" stroke="#818b98" stroke-width="1.5" fill="none"/>
<path d="M190.0 221.0l-4 -7h8z" fill="#818b98"/>
